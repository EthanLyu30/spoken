name: Keep backend warm

# Best-effort fallback for the independent Cloudflare Cron in ops/keepalive.
# GitHub schedule events can be delayed/dropped and cannot guarantee warmth.
# Both run 24/7 to keep the single free Render service awake (~744 instance-hours
# in a 31-day month against the 750-hour workspace allowance).
# The shared probe allows cold starts and fails visibly after exhausted retries.

on:
  schedule:
    - cron: "3-58/5 * * * *" # stagger away from the top of the hour
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: backend-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Ping health endpoint
        env:
          BACKEND_HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL || 'https://spoken-backend-sg.onrender.com/api/ready' }}
        run: node ops/keepalive/cli.mjs

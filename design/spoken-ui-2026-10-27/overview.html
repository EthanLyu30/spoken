<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spoken · 核心页面总览</title><link rel="icon" href="data:,"><style>*{box-sizing:border-box}body{margin:0;background:#fffcf7;color:#342019;font:14px/1.5 "Microsoft YaHei","Segoe UI",sans-serif}.wrap{padding:28px 48px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}h1{font-size:27px;letter-spacing:-.5px;margin:0 0 7px}p{font-size:11px;color:#907563;margin:0}.head a{color:#d86049;text-decoration:none;font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 18px}.item{border:1px solid #e8d8c7;border-radius:9px;overflow:hidden;background:#fffefa}.item img{width:100%;aspect-ratio:16/10;display:block;border-bottom:1px solid #ede1d5}.item h2{font-size:12px;font-weight:700;margin:0;padding:8px 12px;line-height:1.4}.item a{color:inherit;text-decoration:none}</style></head><body><main class="wrap"><div class="head"><div><h1>Spoken · 全站视觉延展</h1><p>核心页面 12 张 · 每张均为 1440×900 桌面视口 · 另含纠错、词典、跟读、账号与系统状态设计</p></div><a href="index.html">查看完整设计画册 →</a></div><div class="grid" id="grid"></div></main><script src="screens.js"></script><script>const ids=['scenes','custom','voice','call','interview-record','interview-results','report','progress','words','daily','profile','settings'];document.querySelector('#grid').innerHTML=ids.map(id=>{const s=DESIGN_SCREENS.find(x=>x.id===id);return `<article class="item"><a href="preview.html?screen=${id}"><img src="screens/${id}.jpg" alt="${s.title}"><h2>${s.title}</h2></a></article>`}).join('');</script></body></html>
